<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reviews — Set Hub</title>
  <meta name="description" content="What guests say about Set Hub on Peerspace." />
  <link rel="stylesheet" href="static/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="index.html">Set hub</a>
      <nav class="nav">
        <div class="sets-drop" id="setsDrop">
          <button id="setsBtn" aria-haspopup="true">THE SETS <img src="static/img/figma/arrow-caret-down.svg" alt="" /></button>
          <div class="drop" id="setsMenu" role="menu"></div>
        </div>
        <a href="book.html" class="hide-m">BOOKING</a>
        <a href="static/admin/" class="hide-m">LOG IN</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1 class="mega" style="text-align:left">Re<br />views</h1>
    <p class="rv-note">Real reviews from our Peerspace guests — unedited, straight from the listings.</p>
    <div class="rv-grid" id="rvGrid"></div>
  </main>

  <script src="static/js/site.js"></script>
  <script>
    (function () {
      var PALETTE = ["#7c3aed", "#0ea5e9", "#16a34a", "#ea580c", "#db2777", "#ca8a04", "#4f46e5", "#0891b2"];
      function esc(s) {
        return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      function initials(name) {
        return name.trim().split(/\s+/).slice(0, 2).map(function (w) { return w[0]; }).join("").toUpperCase();
      }
      function color(name) {
        var h = 0, i;
        for (i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 997;
        return PALETTE[h % PALETTE.length];
      }
      fetch("content/reviews.json").then(function (r) { return r.json(); }).then(function (list) {
        var g = document.getElementById("rvGrid");
        if (!list.length) { g.innerHTML = '<p class="rv-note">Reviews are being collected — check back soon.</p>'; return; }
        list.forEach(function (rv) {
          var stars = "";
          for (var i = 0; i < 5; i++) stars += i < rv.stars ? "★" : "☆";
          var card = document.createElement("article");
          card.className = "rv-card";
          card.innerHTML =
            '<div class="rv-head"><span class="rv-ava" style="background:' + color(rv.name) + '">' + esc(initials(rv.name)) + '</span>' +
            '<div><b>' + esc(rv.name) + (rv.role ? ' <span class="rv-role">(' + esc(rv.role) + ')</span>' : '') + '</b>' +
            '<small>' + esc(rv.booked) + '</small></div></div>' +
            '<div class="rv-stars"><span class="rv-star">' + stars + '</span>' +
            '<span class="rv-again"><i>✓</i> Yes, I would book again.</span></div>' +
            '<p class="rv-text">' + esc(rv.text) + '</p>' +
            '<div class="rv-foot"><span>' + esc(rv.date) + '</span><span class="rv-via">via Peerspace</span></div>';
          g.appendChild(card);
        });
      }).catch(function () {
        document.getElementById("rvGrid").innerHTML = '<p class="rv-note">Reviews are being collected — check back soon.</p>';
      });
    })();
  </script>
</body>
</html>
